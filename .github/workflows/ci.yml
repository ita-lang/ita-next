# ===========================================================================
# CI do ita-next — dois gates: front-end (F1-F6) e backend (F7, codegen)
# ===========================================================================
# O front-end é Dart PURO: não emite Kernel e não depende do vendor. Roda com o
# SDK stable via dart-lang/setup-dart.
#
# O backend (F7) precisa dos TRÊS componentes do `dart-sdk.pin` casando: o
# binário `dart`, o `vm_platform.dill` e o `pkg/kernel` vendorado. No CI os três
# vêm de graça — o `setup-dart` instala o binário E o `vm_platform.dill` da mesma
# versão, e o vendor (`third_party/dart/<tag>/pkg`, 8.7 MB) é VERSIONADO e vem no
# checkout. Nada de `tools/pin-dart.sh` aqui: ele existe para materializar
# localmente o que o runner já tem (e baixa o zip macos-arm64, inútil no Linux).
#
# ⚠️ O que tem de casar é a **VERSÃO** (que fixa o formato binário de Kernel),
# NÃO o OS/arch. O `vm_platform.dill` não é parametrizado por plataforma —
# `runtime/vm/BUILD.gn@3.12.2` (`gen_vm_platform`) não passa `target_os` nem
# `target_cpu`, e o `copy_vm_dill_files` do `sdk/BUILD.gn` vive no grupo COMUM.
# (O que é arch-específico no SDK são os binários, não os `.dill`.) Some-se que
# `platformDillPath()` deriva o platform de `Platform.resolvedExecutable`: o SDK
# que compila é, por construção, o mesmo que executa — nunca há cruzamento.
# ===========================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela runs obsoletos do mesmo ref quando chega um push novo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # As catracas do PORTÃO em si — as únicas que não precisam de Dart nenhum.
  # Job separado de propósito: roda em ~15 s, e uma falha aqui não pode ser
  # confundida com falha do compilador na lista de checks da PR.
  #
  # Por que existe (auditado em 2026-08-26): das sete dependências do `make
  # gate`, o CI rodava SEIS. A ausente era justamente o `gate-hook-selftest` —
  # a catraca que prova que `gate-armed-hook.sh` sabe ficar VERMELHO. Ela só
  # rodava pelo `pre-commit` nativo, que só dispara se `core.hooksPath` estiver
  # configurado; e `core.hooksPath` é config LOCAL, que não vem no clone. Logo:
  # clone sem `make setup-hooks` + mutante no hook = verde em todo lugar, zero
  # diagnóstico. Medido: o mutante `exit 2`→`exit 0` reprova 10 dos 21 casos.
  harness:
    name: portão (catracas do harness — sem Dart)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # R14 — antes de qualquer asserção, a régua prova que sabe reprovar.
      - name: a catraca do hook sabe ficar VERMELHA (R14)
        run: make gate-hook-selftest

      # A catraca DESTE furo: compara os pré-requisitos de `gate:` com os
      # `make <alvo>` que este arquivo executa. Alvo novo no portão sem step
      # aqui reprova, com nome — em vez de divergir em silêncio, como durou.
      - name: o CI roda o portão inteiro
        run: make ci-cobre-gate

  analyze-test:
    name: analyze + test (front-end F1-F6, Dart puro)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart stable 3.12.2
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      # Pelo Makefile, não por `dart analyze`/`dart test` com `working-directory`.
      # Os alvos fazem exatamente isso (`cd compiler && dart …`), mas UMA fonte de
      # verdade é o que deixa o `ci-cobre-gate` comparar as duas listas por nome.
      # Com dois caminhos para a mesma verificação, "o CI cobre o portão" viraria
      # julgamento humano de equivalência — e a régua, uma lista de exceções cuja
      # falha-padrão é OK (R5).
      - name: pub get (compiler)
        run: make get

      - name: analyze (compiler)
        run: make analyze

      - name: test (compiler)
        run: make test

  # O NOME carrega o recorte de alvo de propósito — antes dizia "VM/JIT — AOT e
  # JS pendentes", porque era o que rodava. Desde 2026-08-06 rodam os três, e o
  # nome mudou junto: quem lê uma PR lê o nome do job e o ✅, nada mais. Se um
  # alvo voltar a sair, é AQUI que a saída tem de aparecer.
  codegen:
    name: golden-runner (F7 → Kernel; VM × AOT × JS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O alvo JS precisa de um runtime, e o SDK do Dart não traz um. Sem este
      # step o runner FALHA com nome ("alvo JS pedido mas `node` não está no
      # PATH") em vez de pular em silêncio — um skip cinza no fim de 200 linhas
      # de ✓ é lido como verde.
      - name: Setup Node (runtime do alvo JS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # UMA fonte de verdade para a versão. Hardcodá-la aqui deixaria o CI
      # divergir do pin em silêncio, e o pin é normativo: "os TRÊS têm que vir
      # da MESMA versão stable".
      - name: Ler o dart-sdk.pin
        id: pin
        run: |
          set -eu
          echo "version=$(grep '^DART_VERSION=' dart-sdk.pin | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Setup Dart (versão do pin)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ steps.pin.outputs.version }}

      # `DART_CG=dart` usa o dart do PATH (o `setup-dart`) em vez do
      # `.dart-sdk/` local, que é gitignorado e não existe aqui.
      #
      # A guarda do pin NÃO é um step separado: ela vive dentro do
      # `golden_test.dart` e assere as TRÊS pontas (dart ↔ vm_platform.dill ↔
      # pkg/kernel vendorado), porque é lá que o acoplamento mora — e assim ela
      # protege a máquina do dev também, não só o CI.
      - name: pub get (codegen)
        run: make codegen-get DART_CG=dart

      - name: analyze (codegen)
        run: make codegen-analyze DART_CG=dart

      # Roda os 3 alvos da §7.7. O `codegen-test` encadeia o golden-runner ANTES
      # do ledger de propósito: o ledger deriva os alvos de
      # `codegen/build/alvos-rodados.txt`, que o runner grava ao fechar verde.
      - name: sanitize + finalize + golden-runner (3 alvos) + ledger
        run: make codegen-test DART_CG=dart

      # Art. IV-6 deixou de ser prosa. A regra existia desde a constituição
      # 1.1.0 (2026-07-16) e foi reincidida na F7 justamente por não ter
      # executável — doutrina sem catraca é violada por quem a escreveu.
      # O `citations` depende do `citations-test`: a régua prova a si mesma
      # antes de reprovar o repo.
      - name: procedência de ruling (Art. IV-6)
        run: make citations

      - name: mensagens de diagnóstico não-ambíguas (M7)
        run: make assertions

      # --- Passos de fases futuras (placeholders comentados) -----------------
      #
      # ✅ Os alvos AOT e JS saíram desta lista em 2026-08-06 — rodam no step
      # acima, dentro do `codegen-test`. O que estava previsto aqui era "AOT
      # primeiro, JS depois porque exige marcar cada CA como MATCH ou
      # DIVERGE-DOCUMENTADO (§12-6) — trabalho de spec". A medição encolheu esse
      # trabalho: das 44 execuções em JS, 42 empatam a VM byte a byte e as 2
      # divergências têm a MESMA causa (double de valor inteiro imprime sem o
      # `.0`), declarada por fixture com `// JS-DIVERGE:`.
      #
      # Guard de compile-time do ADR-0006 — *"falha se a mediana > 0,5s/arquivo"*.
      # `make bench` depende do `itac-aot`, então este step TAMBÉM prova que o
      # binário AOT builda no CI (ADR-0006: "CI builda o AOT uma vez").
      # Medido em 2026-08-06 (M2): mediana 63 ms/arquivo.
      - name: Benchmark de compile-time (guard do ADR-0006)
        run: make bench DART_CG=dart
